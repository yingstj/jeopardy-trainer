[theme]
primaryColor = "#4c51bf"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f7"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 5000
maxUploadSize = 10
maxMessageSize = 50
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
